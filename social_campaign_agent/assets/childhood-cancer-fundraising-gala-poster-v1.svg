  <text x="120" y="623" fill="#fffdf8" font-family="Georgia, serif" font-size="43">2026</text>
  <line x1="120" y1="655" x2="943" y2="655" stroke="#c5b38f" stroke-width="2" opacity=".8"/>
  <text x="120" y="693" fill="#f2e9d6" font-family="Arial, sans-serif" font-size="20">Confirm venue and event details with the organizer.</text>

