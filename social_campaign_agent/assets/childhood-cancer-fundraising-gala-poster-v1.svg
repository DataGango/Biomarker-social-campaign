  <text x="76" y="291" fill="#253c32" font-family="Georgia, serif" font-size="73" font-weight="700">discovery <tspan fill="#8f6a35">&amp;</tspan> hope.</text>
  <text x="80" y="350" fill="#56344f" font-family="Arial, sans-serif" font-size="25" font-weight="700">Children’s Cancer Foundation · 42nd Annual Gala</text>

