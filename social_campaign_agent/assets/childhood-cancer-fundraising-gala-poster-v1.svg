<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title description">
  <title id="title">An evening for discovery and hope: Children’s Cancer Foundation 42nd Annual Gala</title>
  <desc id="description">An independent community-awareness draft for the Children’s Cancer Foundation 42nd Annual Gala, listed for November 7, 2026. It directs viewers to the Foundation’s official event page for current venue and event details and to the official ticket and sponsorship page. It is not an official event announcement.</desc>
  <rect width="1080" height="1350" fill="#f4f1e8"/>
  <rect width="1080" height="16" fill="#8f6a35"/>

