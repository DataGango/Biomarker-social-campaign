  <circle cx="904" cy="229" r="137" fill="none" stroke="#315b48" stroke-width="3" opacity=".5"/>
  <path d="M845 247c34-46 67-46 101 0s67 46 101 0M859 204h90M859 284h90" fill="none" stroke="#56344f" stroke-width="8" stroke-linecap="round" opacity=".76"/>

  <text x="76" y="92" fill="#315b48" font-family="Arial, sans-serif" font-size="21" font-weight="700" letter-spacing="1.6">COMMUNITY AWARENESS · FUNDRAISING EVENT</text>
