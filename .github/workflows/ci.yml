name: Biomarker Regression

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-regression:
    name: Python unit and Selenium regression
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run all Python and Selenium tests
        run: python -m unittest discover -v

      - name: Run offline multi-agent evaluations
        run: python -m multi_agent.run_evals

  playwright-regression:
    name: Playwright Chromium regression
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: test_scripts/package-lock.json

      - name: Install Playwright test package
        working-directory: test_scripts
        run: npm ci

      - name: Install Playwright Chromium and OS dependencies
        working-directory: test_scripts
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        working-directory: test_scripts
        env:
          CI: "true"
          PYTHON: python
        run: npm test

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-regression-results
          path: test_scripts/test-results/
          if-no-files-found: ignore
          retention-days: 7
